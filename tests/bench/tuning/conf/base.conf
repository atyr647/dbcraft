# Always included by run.sh: logging needed to correlate slow ticks with server events.  No performance settings here.
log_line_prefix = '%m [%p] '
log_checkpoints = on
log_autovacuum_min_duration = 0
log_lock_waits = on
deadlock_timeout = 100ms
log_temp_files = 0
log_timezone = 'UTC'
listen_addresses = '127.0.0.1'
