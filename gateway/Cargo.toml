[package]
name = "dbcraft-gateway"
version = "0.1.0"
edition = "2021"
description = "dbcraft gateway: the byte pipe between Minecraft clients and the database (frames, AES-CFB8, RSA, Mojang session check). No crates.io dependencies."
license = "MIT"

# No crates.io dependencies at all: the standard library plus the system's libpq, libcrypto and libcurl through hand-written bindings (src/ffi/).
# The only dependency is the std-only core of this repository.  `gateway/build.sh` builds the same thing with plain rustc.

[workspace]
members = ["core"]

[[bin]]
name = "dbcraft-gateway"
path = "src/main.rs"

[dependencies]
dbcraft-gateway-core = { path = "core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
