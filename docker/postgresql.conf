# dbcraft: recommended PostgreSQL 16 settings.  Only settings that differ from the PostgreSQL defaults are listed; each has its measurement, risk and the
# alternatives that did not help in docs/TUNING.md.  Used by the container (`postgres -c config_file=/etc/dbcraft/postgresql.conf`) and by tests/bench/tuning.
# Settings that ALTER DATABASE can carry (jit, synchronous_commit, parallelism, the idle-transaction guard) are ALSO stored in the database by sql/450_tuning.sql.

# ---- connections
listen_addresses = '*'                    # inside the container; the published ports and pg_hba decide who can connect
max_connections = 100                     # the gateway needs a handful; each admin session is one

# ---- memory
shared_buffers = 128MB                    # DELIBERATELY SMALL.  Each tick truncates about eight unlogged queue tables and ten temp tables; dropping a truncated table's old file
                                          # makes the commit scan the whole buffer pool: commit 6.5 ms at 128MB, 7.2 ms at 512MB, 10.7 ms at 2GB (docs/TUNING.md).  The OS page cache holds
                                          # the rest of the world.  Raise it only together with removing those truncates from the tick.
effective_cache_size = 4GB                # planner hint only: about half of the RAM the box has for the OS cache (no measurable effect on tick time)
work_mem = 64MB                           # twenty players joining at once queue 60 MB of chunk packets and net.drain_outbox() sorts them: 4MB and 16MB spill a 30 MB temp file, 64MB does not (docs/TUNING.md)
maintenance_work_mem = 128MB              # vacuum and index builds
huge_pages = try                          # used when the host reserves them; none were available where this was measured

# ---- WAL and durability: fsync stays ON.  synchronous_commit = off is the one deliberate relaxation (set here and per database)
fsync = on
full_page_writes = on                     # off saved 16% WAL and no time; a torn page after a power loss is not worth it
synchronous_commit = off                  # a COMMIT returns before its WAL is flushed: after an OS crash or power loss the last few hundred ms of committed ticks (wal_writer_delay,
                                          # at most 3x) can be lost, the cluster is never corrupted.  No tick-time gain was measurable on local NVMe-class storage; it insulates the tick
                                          # from storage with slow flushes (network disks).  Set `on` if zero loss matters more than tick time on slow storage.
wal_level = replica                       # minimal saved 3 KB of 37 KB per tick and no time, but forbids base backups and replication
wal_compression = off                     # pglz made p99 worse (147 ms against 87 ms): CPU on the tick's path for 16% less WAL
wal_buffers = 16MB
max_wal_size = 4GB                        # default 1GB: at 0.75 MB/s of WAL that is a forced checkpoint every 22 minutes; with 4GB the timed one (below) decides
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9        # spread the writes over the interval (the default in 14+, stated for clarity)

# ---- planner and executor: short statements, no parallelism, no JIT
jit = off                                 # jit on: tick 58.6 ms against 50.8 ms, ticks over 100 ms tripled (docs/TUNING.md)
max_parallel_workers_per_gather = 0       # no gain measured; a parallel plan costs worker start-up on every execution of a short statement
random_page_cost = 1.1                    # SSD-class storage; planner hint

# ---- autovacuum
autovacuum_naptime = 10s                  # 1min by default: the queue tables churn thousands of rows a tick; with 1min they reached 53 MB in 100 s, with 10s 5.5 MB, and the tick was 4 ms faster (docs/TUNING.md)
# NOTE: autovacuum only sees the statistics a backend REPORTS, and a backend reports when it goes idle.  A gateway that sends one statement per tick is fine.  The PL/Python development
# gateway (one long CALL) never goes idle: run tools/janitor.sh next to it (the container's entrypoint does), see docs/TUNING.md.

# ---- guards
idle_in_transaction_session_timeout = 10s # a session idle inside a transaction pins the vacuum horizon for the whole database: ticks 2x slower after 10 s, 10x after a minute (docs/TUNING.md)

# ---- logging: what is needed to find a slow tick afterwards
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_lock_waits = on
log_temp_files = 8MB
log_min_duration_statement = 250ms        # top-level statements only: `select mc.server_tick()` from an external gateway shows up here when a tick takes five times its budget
log_line_prefix = '%m [%p] %q%u@%d '
