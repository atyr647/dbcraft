# dbcraft: PostgreSQL with the dbcraft schema and the development gateway on port 25565.  One command:
#
#   export DBCRAFT_PASSWORD=choose-one
#   docker compose up --build
#
# The first run downloads the pinned vanilla server jar from Mojang, runs the official data generator and records a capture (about two minutes, needs Internet
# access and accepts Mojang's EULA by running their server), into the volume `dbcraft-mojang`.  Mojang data is never in an image or in git.  See docker/README.md.
# (Not testable where this was written: Docker was not available there.  The steps inside the images are the same scripts that tools/bootstrap.sh runs on a host.)
services:
  mojang-data:                          # one-shot: jar + generator reports + captures into the volume (idempotent: a finished volume is left alone)
    build:
      context: .
      dockerfile: docker/Dockerfile.data
    image: dbcraft-data:latest
    restart: "no"
    volumes:
      - dbcraft-mojang:/data

  dbcraft:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: dbcraft:latest
    restart: unless-stopped
    depends_on:
      mojang-data:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: dbcraft
      POSTGRES_PASSWORD: ${DBCRAFT_PASSWORD:?set DBCRAFT_PASSWORD}
      POSTGRES_DB: dbcraft
      DBCRAFT_DEV_GATEWAY: "1"          # run the PL/Python development gateway inside this container (offline mode, no compression)
      DBCRAFT_GATEWAY_PORT: "25565"
      DBCRAFT_GAMEMODE: creative
      DBCRAFT_MOTD: dbcraft
    ports:
      - "25565:25565"                   # Minecraft clients
      - "127.0.0.1:5432:5432"           # SQL access, local only: this is the admin console of the whole server
    ulimits:
      nofile: { soft: 65536, hard: 65536 }   # the gateway backend holds one socket per player; the default 1024 stops it near 1,000 players
    shm_size: 256mb                     # shared_buffers is 128MB (docker/postgresql.conf)
    volumes:
      - dbcraft-data:/var/lib/postgresql/data
      - dbcraft-mojang:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbcraft -d dbcraft"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 60s              # a clean shutdown checkpoints; the world is durable, the per-tick queues are not
volumes:
  dbcraft-data:
  dbcraft-mojang:
